name: Collecte veille SEO/GEO

# Alternative gratuite à Vercel Cron : le plan Vercel Hobby ne déclenche les
# cron jobs qu'une fois par jour. Utilisez CE fichier (Hobby) OU vercel.json
# (Pro), jamais les deux, pour éviter d'appeler l'IA deux fois pour rien.
on:
  schedule:
    - cron: "0 5,9,13,17 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la route de collecte
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/collect" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
